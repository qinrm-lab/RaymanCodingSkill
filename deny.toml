[graph]
all-features = true

# 普通 cargo-deny 调用使用默认用户级缓存。完整审计会把该数据库复制到
# 一次性受管目录，并仅在临时配置中注入 db-path，避免锁定只读用户缓存；
# advisories 检查保持启用，源配置也不会被改写。
[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
]
exceptions = []
clarify = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
