[graph]
all-features = true

# db-path 不设：用 cargo-deny 默认的用户级缓存。
# 以前指向 .RaymanCodingSkill/tmp/，会被 `rayman temp cleanup` 连带删掉。
[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
]
exceptions = []
clarify = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
