# 多 agent 科研编排配置。
# Scientist agent 可以触发白名单实验命令，但不能编辑文件、批准验证或关闭目标。

research_agents:
  enabled: true
  max_parallel_agents: 4

  scientist:
    can_run_experiments: true
    can_edit_files: false
    can_close_goals: false

  command_policy:
    allow_network: false
    # Scientist experiments are bounded by a 120-second hard timeout in the runtime.
    # Full-suite commands such as `cargo test --all` stay on the primary validation path.
    # Hard boundary: must stay true. Execution also rejects outside-workspace cwd.
    require_workspace_cwd: true
    reject_shell_operators: true
    diff_check_repo_tracked_files: true
    allowed:
      - ["rayman", "context", "status"]
      - ["rayman", "context", "task"]
      - ["rayman", "impact"]
      - ["rayman", "regression", "plan"]
      - ["rayman", "eval", "run"]
      - ["rayman", "security", "audit"]
      - ["cargo", "fmt", "--check"]
      - ["cargo", "clippy", "--all-targets", "--", "-D", "warnings"]
