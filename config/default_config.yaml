# RaymanCodingSkill 默认配置
# 这是主配置文件，其他详细配置在独立的 YAML 文件中

# 配置文件引用。Rust 运行时直接消费 default_config.yaml、models.yaml 和 model_updates.yaml；
# prompts/skills/testing/conflicts 当前是治理和参考配置，除非具体代码路径显式读取。
config_files:
  models: "models.yaml"           # 模型配置
  skills: "skills.yaml"           # 技能详细配置
  prompts: "prompts.yaml"         # 提示词模板
  testing: "testing.yaml"         # 测试配置
  conflicts: "conflicts.yaml"     # 冲突检测配置
  model_updates: "model_updates.yaml" # 模型更新配置
  auxiliary_ai: "auxiliary_ai.yaml" # 可选本地辅助 AI 配置
  research_agents: "research_agents.yaml" # 多 agent 科研编排和 scientist 实验策略

# 默认模型配置
default_model:
  type: "openai"  # openai, anthropic, local, thirdparty_a, thirdparty_b
  name: "gpt-4"
  temperature: 0.7
  max_tokens: 2000
  top_p: 1.0

# 模型路由配置
# mode=manual 时使用每个任务的 manual 模型；mode=auto 时使用 primary，并在额度/限流/超时等临时失败时切换 fallback。
model_routing:
  enabled: true
  mode: "manual"  # manual, auto
  fallback_on_failure: true
  switch_cooldown_seconds: 0
  routes:
    planning:
      manual: "openai/gpt-4"
      primary: "openai/gpt-4"
      fallback:
        - "thirdparty_a/thirdparty-a-model-1"
        - "thirdparty_b/thirdparty-b-model-1"
    code_generation:
      manual: "openai/gpt-4o"
      primary: "openai/gpt-4o"
      fallback:
        - "thirdparty_a/thirdparty-a-model-1"
        - "anthropic/claude-sonnet-4-6"
    code_refactor:
      manual: "openai/gpt-4o"
      primary: "openai/gpt-4o"
      fallback:
        - "thirdparty_a/thirdparty-a-model-1"
        - "thirdparty_b/thirdparty-b-model-1"
    code_explain:
      manual: "openai/gpt-4o"
      primary: "openai/gpt-4o"
      fallback:
        - "anthropic/claude-sonnet-4-6"
        - "thirdparty_a/thirdparty-a-model-2"
    code_review:
      manual: "anthropic/claude-opus-4-7"
      primary: "anthropic/claude-opus-4-7"
      fallback:
        - "openai/gpt-4o"
        - "thirdparty_b/thirdparty-b-model-1"
    obsolete_code_pruning:
      manual: "anthropic/claude-opus-4-7"
      primary: "anthropic/claude-opus-4-7"
      fallback:
        - "openai/gpt-4o"
        - "thirdparty_b/thirdparty-b-model-1"
    implementation_validation:
      manual: "anthropic/claude-opus-4-7"
      primary: "anthropic/claude-opus-4-7"
      fallback:
        - "openai/gpt-4o"
        - "thirdparty_b/thirdparty-b-model-1"
    test_generation:
      manual: "anthropic/claude-sonnet-4-6"
      primary: "anthropic/claude-sonnet-4-6"
      fallback:
        - "openai/gpt-4o"
        - "thirdparty_a/thirdparty-a-model-2"
    regression_test:
      manual: "anthropic/claude-sonnet-4-6"
      primary: "anthropic/claude-sonnet-4-6"
      fallback:
        - "openai/gpt-4o"
        - "thirdparty_b/thirdparty-b-model-2"
    doc_sync:
      manual: "openai/gpt-4o"
      primary: "openai/gpt-4o"
      fallback:
        - "thirdparty_a/thirdparty-a-model-2"
    instruction_lifecycle:
      manual: "openai/gpt-4o"
      primary: "openai/gpt-4o"
      fallback:
        - "thirdparty_b/thirdparty-b-model-2"
    research_planner:
      manual: "openai/gpt-5.5"
      primary: "openai/gpt-5.5"
      fallback:
        - "anthropic/claude-opus-4-7"
    research_scientist:
      manual: "openai/gpt-5.5"
      primary: "openai/gpt-5.5"
      fallback:
        - "anthropic/claude-opus-4-7"
    research_critic:
      manual: "openai/gpt-5.5"
      primary: "openai/gpt-5.5"
      fallback:
        - "anthropic/claude-opus-4-7"
    research_reflector:
      manual: "openai/gpt-5.5"
      primary: "openai/gpt-5.5"
      fallback:
        - "anthropic/claude-sonnet-4-6"
    research_arbiter:
      manual: "openai/gpt-5.5"
      primary: "openai/gpt-5.5"
      fallback:
        - "anthropic/claude-opus-4-7"
    research_safety_monitor:
      manual: "openai/gpt-5.5"
      primary: "openai/gpt-5.5"
      fallback:
        - "anthropic/claude-opus-4-7"
    default:
      manual: "openai/gpt-4o"
      primary: "openai/gpt-4o"
      fallback:
        - "thirdparty_a/thirdparty-a-model-1"

# 模型特定配置
models:
  openai:
    api_key_env: "OPENAI_API_KEY"
    base_url: null
    timeout: 60
    retry_attempts: 3

  anthropic:
    api_key_env: "ANTHROPIC_API_KEY"
    base_url: null
    timeout: 60
    retry_attempts: 3

  local:
    base_url: "http://localhost:11434"  # Ollama default
    timeout: 120

  # 第三方小众模型占位 1：你手工填写 base_url、模型名和 THIRD_PARTY_A_API_KEY。
  thirdparty_a:
    adapter: "openai_compatible"
    api_key_env: "THIRD_PARTY_A_API_KEY"
    base_url: "https://sapi.quan2go.com/openai"
    timeout: 60
    retry_attempts: 2

  # 第三方小众模型占位 2：你手工填写 base_url、模型名和 THIRD_PARTY_B_API_KEY。
  thirdparty_b:
    adapter: "openai_compatible"
    api_key_env: "THIRD_PARTY_B_API_KEY"
    base_url: "https://api.thirdparty-b.example/v1"
    timeout: 60
    retry_attempts: 2

# 快速技能开关（详细配置见 skills.yaml）
skills:
  code_generation:
    enabled: true
  code_review:
    enabled: true
  implementation_validation:
    enabled: true
  code_refactor:
    enabled: true
  code_explain:
    enabled: true
  test_generation:
    enabled: true
  regression_test:
    enabled: true
  doc_sync:
    enabled: true
  conflict_detection:
    enabled: true

# 本地备份管理
backup_management:
  enabled: true
  backup_dir: ".RaymanCodingSkill/backups"
  retention_days: 30
  max_backups_per_target: 20
  require_comment: true
  review_apply_requires_backup: true
  ignored_dirs:
    - ".git"
    - "__pycache__"
    - ".mypy_cache"
    - ".cache"
    - ".tmp"
    - "node_modules"
    - "dist"
    - "build"

# 运行期临时目录
runtime_temp:
  root: ".RaymanCodingSkill/tmp"
  retention_hours: 24
  preserve_failed: true

# 会话连续性和待完成门禁
session_continuity:
  enabled: true
  state_file: ".RaymanCodingSkill/pending_work.json"
  require_all_complete_before_review_pass: true
  scan_unfinished_code_markers: true
  scan_workspace_code_markers: true
  max_scan_file_bytes: 1048576
  code_extensions:
    - ".py"
    - ".js"
    - ".jsx"
    - ".ts"
    - ".tsx"
    - ".java"
    - ".go"
    - ".rs"
    - ".c"
    - ".h"
    - ".cpp"
    - ".hpp"
    - ".cs"
    - ".php"
    - ".rb"
    - ".swift"
    - ".kt"
    - ".kts"
    - ".scala"
    - ".sh"
    - ".ps1"
    - ".sql"
  ignored_dirs:
    - ".git"
    - ".RaymanCodingSkill"
    - "__pycache__"
    - ".mypy_cache"
    - ".cache"
    - ".tmp"
    - "node_modules"
    - "dist"
    - "build"
    - "logs"

# 日志配置
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {message}"
  file: "logs/rayman_skill.log"
  rotation: "10 MB"
  retention: "7 days"

# 语言偏好
language_preference: "auto"  # auto, zh, en
