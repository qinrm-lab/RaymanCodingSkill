  - id: docs_html_chinese_coverage
    title: HTML developer docs, documentation index, Chinese/CJK handling, and feature coverage document
    doc_anchors:
      - path: docs/README.md
        contains: "Feature Coverage"
      - path: docs/FEATURE_COVERAGE.md
        contains: "Feature Coverage"
      - path: references/skill-documentation-structure-and-lossless-splitting.md
        contains: "Documentation Structure And Lossless Splitting"
      - path: SKILL.md
        contains: "Chinese Text, Display, And Encoding"
      - path: docs/CLI.md
        contains: "customer project docs are incomplete/stale"
      - path: references/skill-proof-and-preservation.md
        contains: "Customer code projects must have complete project documentation before success"
    implementation_anchors:
      - path: crates/rayman-core/src/docs.rs
        contains: "pub fn maintain_html_docs"
      - path: crates/rayman-core/src/docs.rs
        contains: "pub fn check_customer_project_docs"
      - path: crates/rayman-core/src/audit.rs
        contains: "fn audit_customer_project_docs"
      - path: crates/rayman-core/src/docs.rs
        contains: "fn render_docs_maintenance_html"
      - path: crates/rayman-core/src/docs.rs
        contains: "fn is_rayman_generated_html"
      - path: crates/rayman-core/src/compile.rs
        contains: "compiles_standalone_rust_file_in_chinese_directory"
    test_anchors:
      - path: crates/rayman-core/src/docs.rs
        contains: "@ui:html_docs"
      - path: crates/rayman-core/src/docs.rs
        contains: "fn maintain_html_docs_excludes_stale_generated_html_evidence"
      - path: crates/rayman-core/src/docs.rs
        contains: "fn maintain_html_docs_check_blocks_obsolete_asset_candidates"
        proves:
          - docs_maintain_check_blocks_obsolete_asset_blockers
      - path: crates/rayman-core/src/docs.rs
        contains: "fn maintain_html_docs_prunes_only_marked_generated_html"
        proves:
          - stale_generated_html_prune
      - path: crates/rayman-core/src/docs.rs
        contains: "fn maintain_html_docs_auto_completes_customer_project_docs"
        proves:
          - customer_project_docs_auto_completion
      - path: crates/rayman-core/src/docs.rs
        contains: "fn maintain_html_docs_preserves_existing_customer_readme"
        proves:
          - customer_project_docs_auto_completion
      - path: crates/rayman-core/src/audit.rs
        contains: "fn audit_blocks_customer_code_project_until_docs_are_auto_completed"
        proves:
          - customer_project_docs_auto_completion
      - path: crates/rayman-core/src/compile.rs
        contains: "中文目录"
    validation_commands:
      - "cargo test -p rayman-core docs:: compile::"
      - rayman docs maintain --check
      - rayman coverage status --format markdown --check --output docs/FEATURE_COVERAGE.md
    ui_surfaces:
      - html_docs
    claim_checks:
      - id: customer_project_docs_auto_completion
        claim: "Customer code projects must have complete README/setup/usage/architecture/configuration/testing documentation; rayman docs maintain auto-completes missing coverage with Rayman-managed docs, preserves hand-written README content, and rayman audit blocks incomplete docs."
        implementation_anchors:
          - path: crates/rayman-core/src/docs.rs
            contains: "pub fn check_customer_project_docs"
          - path: crates/rayman-core/src/docs.rs
            contains: "CUSTOMER_PROJECT_GUIDE_RELATIVE"
          - path: crates/rayman-core/src/audit.rs
            contains: "fn audit_customer_project_docs"
        test_anchors:
          - path: crates/rayman-core/src/docs.rs
            contains: "fn maintain_html_docs_auto_completes_customer_project_docs"
            proves:
              - customer_project_docs_auto_completion
          - path: crates/rayman-core/src/docs.rs
            contains: "fn maintain_html_docs_preserves_existing_customer_readme"
            proves:
              - customer_project_docs_auto_completion
          - path: crates/rayman-core/src/audit.rs
            contains: "fn audit_blocks_customer_code_project_until_docs_are_auto_completed"
            proves:
              - customer_project_docs_auto_completion
        validation_commands:
          - "cargo test -p rayman-core docs:: audit::"
          - rayman docs maintain --check
          - rayman audit
      - id: docs_maintain_check_blocks_obsolete_asset_blockers
        claim: "rayman docs maintain --check fails when obsolete asset retirement blockers exist, and reports required cleanup actions instead of claiming documentation is current."
        implementation_anchors:
          - path: crates/rayman-core/src/docs.rs
            contains: "let obsolete_asset_blockers = asset_retirement.blockers.clone()"
          - path: crates/rayman-core/src/docs.rs
            contains: "if !obsolete_asset_blockers.is_empty()"
          - path: crates/rayman-cli/src/main.rs
            contains: "if report.status == \"blocked\""
        test_anchors:
          - path: crates/rayman-core/src/docs.rs
            contains: "fn maintain_html_docs_check_blocks_obsolete_asset_candidates"
            proves:
              - docs_maintain_check_blocks_obsolete_asset_blockers
        validation_commands:
          - "cargo test -p rayman-core docs::"
          - rayman docs maintain --check
      - id: stale_generated_html_prune
        claim: "rayman docs maintain --apply-prune deletes only stale Rayman-generated HTML files and leaves manual HTML/source files untouched."
        implementation_anchors:
          - path: crates/rayman-core/src/docs.rs
            contains: "fn prune_stale_generated_docs"
          - path: crates/rayman-core/src/docs.rs
            contains: "fn is_rayman_generated_html"
          - path: crates/rayman-core/src/docs.rs
            contains: "options.apply_prune"
        test_anchors:
          - path: crates/rayman-core/src/docs.rs
            contains: "fn maintain_html_docs_prunes_only_marked_generated_html"
            proves:
              - stale_generated_html_prune
        validation_commands:
          - "cargo test -p rayman-core docs::"
          - rayman docs maintain --check
