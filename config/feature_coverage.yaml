      - id: auxiliary_ai_usage_metrics
        claim: Auxiliary AI usage and contribution stats expose real call counts separately from queued/skipped records, provider attempts, duration, failure kind, skip reason, optional estimated cost, and recent implementation-validation contribution evidence by project, task, and provider while preserving old JSON compatibility.
