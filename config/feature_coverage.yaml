features:
  - id: coding_workflows
    title: Code generation, review, test, refactor, and explain workflows
    doc_anchors:
      - path: README.md
        contains: "code generation, review, tests"
      - path: QUICKSTART.md
        contains: "Generate, Review, And Test"
      - path: docs/CLI.md
        contains: "Generation, Review, And Tests"
    implementation_anchors:
      - path: crates/rayman-cli/src/cli.rs
        contains: "Generate(GenerateArgs)"
      - path: crates/rayman-core/src/skills.rs
        contains: "fn code_generation_prompt"
    test_anchors:
      - path: crates/rayman-cli/src/cli.rs
        contains: "fn cli_parses_coding_workflow_commands"
        proves:
          - rayman generate
          - rayman review
          - rayman test
          - rayman refactor
          - rayman explain
      - path: crates/rayman-cli/tests/ui_contract.rs
        contains: "@ui:cli"
      - path: crates/rayman-core/src/skills.rs
        contains: "fn validation_prompt_checks_chinese_console_and_path_handling"
    validation_commands:
      - cargo test -p rayman-cli
      - "cargo test -p rayman-core skills::"
    ui_surfaces:
      - cli
    public_commands:
      - rayman generate
      - rayman review
      - rayman test
      - rayman refactor
      - rayman explain

