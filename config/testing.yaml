# 测试配置
#
# 当前文件只描述本仓库已经落地的 Rust 与 rayman 门禁体系。
# 具体执行事实以 docs/TESTING.md、config/feature_coverage.yaml 和
# `rayman gate status --check` 为准。

# 测试框架配置
test_frameworks:
  rust:
    default: cargo-test
    supported:
      - cargo-test
    command: "cargo test --all"
    notes:
      - "使用 Cargo 原生 #[test] / #[tokio::test] 测试。"
      - "需要临时 target 时使用 .RaymanCodingSkill/tmp 下的 CARGO_TARGET_DIR。"

# 测试类型配置
test_types:
  positive:
    name: "正向测试"
    description: "验证正常输入下的预期行为"
    priority: 1
    required: true

  negative:
    name: "负向测试"
    description: "验证异常输入的错误处理"
    priority: 2
    required: true

  boundary:
    name: "边界测试"
    description: "测试边界值和极端情况"
    priority: 3
    required: true

  cross:
    name: "交叉验证测试"
    description: "测试多种输入组合"
    priority: 4
    required: false

# Rust 测试生成规则
test_generation_rules:
  naming_conventions:
    rust: "descriptive_snake_case"

  assertion_patterns:
    equality: "assert_eq!({actual}, {expected})"
    inequality: "assert_ne!({actual}, {expected})"
    truth: "assert!({condition})"
    exception: "assert!(result.is_err()) or assert!(matches!(result, Err(_)))"
    contains: "assert!({collection}.contains(&{item}))"

  function_attributes:
    sync: "#[test]"
    async_tokio: "#[tokio::test]"

  scope: "function"

# rayman 门禁配置
rayman_gate_config:
  readiness_gate:
    command: "rayman gate status --check"
    includes:
      - workspace_skill
      - context_freshness
      - subagent_ledger
      - managed_temp
      - feature_coverage
      - docs_maintain
      - dependency_policy
      - security_audit
      - repository_audit
      - release_evidence_no_write

  focused_gates:
    - "cargo fmt --check"
    - "cargo clippy --all-targets -- -D warnings"
    - "cargo test --all"

  broad_gates:
    - "cargo fmt --check"
    - "cargo clippy --all-targets -- -D warnings"
    - "cargo test --all"
    - "cargo deny check"
    - "rayman coverage status --check"
    - "rayman docs maintain --check"
    - "rayman security audit"
    - "rayman audit"
    - "rayman release evidence --label local --no-write"

  regression_profiles:
    auto: "rayman regression run --profile auto"
    quick: "rayman regression run --profile quick"
    full: "rayman regression run --profile full"
    shared_parallel_full: "rayman regression run --profile shared-parallel-full"
    parallel_full: "rayman regression run --profile parallel-full"

# 临时目录与清理策略
managed_temp:
  root: ".RaymanCodingSkill/tmp"
  cargo_target_dir_policy: "use workspace-local CARGO_TARGET_DIR under managed temp"
  cleanup_after_success:
    - "rayman temp cleanup --completed"
    - "rayman temp cleanup --cargo-targets"
  status_gate: "rayman temp status"

# 测试闭环要求
closure_requirements:
  current_files_authoritative: true
  require_feature_coverage_for_public_claims: true
  require_docs_config_sync: true
  require_clean_managed_temp_before_success: true
  require_current_cli_for_gate_results: true
