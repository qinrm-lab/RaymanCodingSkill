# 模型自动更新配置

# 自动更新设置
auto_update:
  enabled: false                   # 是否启用自动更新
  interval_days: 7                 # 更新间隔（天）
  check_on_startup: false          # 启动时检查更新
  notify_on_new_models: true       # 发现新模型时通知
  auto_apply_updates: false        # 是否自动应用更新（建议手动审核）

# 更新源配置
update_sources:
  openai: true                     # OpenAI 模型
  anthropic: true                  # Anthropic 模型
  google: true                     # Google 模型
  deepseek: true                   # DeepSeek 模型
  qwen: true                       # Qwen 模型
  local: false                     # 本地模型（需要手动更新）

# 更新策略
update_strategy:
  # 新模型默认配置
  default_config:
    context_window: 128000
    max_output: 4096
    cost_per_1k_input: 0.0         # 需要手动更新
    cost_per_1k_output: 0.0
    capabilities:
      - text
    recommended_for: []

  # 是否保留已删除的模型
  keep_deprecated_models: false

  # 是否更新现有模型的配置
  update_existing_models: true    # 避免覆盖手动配置

# 通知设置
notifications:
  # 通知渠道
  channels:
    - console                      # 控制台输出
    - log                          # 日志文件
    - file                         # 更新报告文件

  # 通知级别
  notify_on:
    new_models: true               # 发现新模型
    deprecated_models: true        # 模型被废弃
    price_changes: true            # 价格变化
    capability_changes: true       # 功能变化

# 缓存设置
cache:
  enabled: true
  cache_dir: ".cache/model_updates"
  keep_reports: 30                 # 保留报告天数

# 备份设置
backup:
  enabled: true
  backup_before_update: true
  backup_dir: ".cache/model_backups"
  keep_backups: 5                  # 保留备份数量

# 验证设置
validation:
  enabled: true
  test_new_models: false           # 是否测试新模型（需要 API Key）
  validate_config: true            # 验证配置文件格式

# 更新日志
last_update: null                  # 最后更新时间（自动填充）
update_history: []                 # 更新历史（自动填充）

# 手动排除的模型（不会被自动添加）
excluded_models:
  openai: []
  anthropic: []
  google: []
  deepseek: []
  qwen: []
  thirdparty_a: []
  thirdparty_b: []

# 定时任务配置
scheduled_tasks:
  # 每周日凌晨 2 点检查更新
  weekly_check:
    enabled: true
    cron: "0 2 * * 0"              # 每周日 2:00 AM
    action: "check_and_notify"     # check_and_notify, check_and_update

  # 每月 1 号生成更新报告
  monthly_report:
    enabled: true
    cron: "0 3 1 * *"              # 每月 1 号 3:00 AM
    action: "generate_report"
