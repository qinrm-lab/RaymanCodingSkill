# 支持的 AI 模型配置

# OpenAI 模型
openai:
  provider: "OpenAI"
  base_url: "https://api.openai.com/v1"

  models:
    # GPT-4 系列（最新）
    gpt-5.5:
      name: "GPT-5.5"
      catalog_status: "route_reference"
      metadata_note: "Strong/frontier model route entry; refresh pricing and context metadata from provider docs before cost-sensitive routing."
      capabilities:
        - text
        - advanced_reasoning
        - code_specialized
        - research
      recommended_for:
        - research_planner
        - research_scientist
        - complex_reasoning
        - parallel_subagent_planning

    gpt-4o:
      name: "GPT-4o"
      context_window: 128000
      max_output: 16384
      cost_per_1k_input: 0.0025
      cost_per_1k_output: 0.01
      capabilities:
        - text
        - vision
        - function_calling
      recommended_for:
        - code_generation
        - code_review
        - complex_reasoning

    gpt-4o-mini:
      name: "GPT-4o Mini"
      context_window: 128000
      max_output: 16384
      cost_per_1k_input: 0.00015
      cost_per_1k_output: 0.0006
      capabilities:
        - text
        - vision
        - function_calling
      recommended_for:
        - code_completion
        - simple_tasks
        - high_volume

    gpt-4-turbo:
      name: "GPT-4 Turbo"
      context_window: 128000
      max_output: 4096
      cost_per_1k_input: 0.01
      cost_per_1k_output: 0.03
      capabilities:
        - text
        - vision
        - function_calling
      recommended_for:
        - code_generation
        - code_review

    gpt-4:
      name: "GPT-4"
      context_window: 8192
      max_output: 4096
      cost_per_1k_input: 0.03
      cost_per_1k_output: 0.06
      capabilities:
        - text
        - function_calling
      recommended_for:
        - complex_reasoning

    # GPT-3.5 系列
    gpt-3.5-turbo:
      name: "GPT-3.5 Turbo"
      context_window: 16385
      max_output: 4096
      cost_per_1k_input: 0.0005
      cost_per_1k_output: 0.0015
      capabilities:
        - text
        - function_calling
      recommended_for:
        - simple_tasks
        - high_volume

    # O1 系列（推理模型）
    o1:
      name: "O1"
      context_window: 200000
      max_output: 100000
      cost_per_1k_input: 0.015
      cost_per_1k_output: 0.06
      capabilities:
        - text
        - advanced_reasoning
      recommended_for:
        - complex_problem_solving
        - algorithm_design

    o1-mini:
      name: "O1 Mini"
      context_window: 128000
      max_output: 65536
      cost_per_1k_input: 0.003
      cost_per_1k_output: 0.012
      capabilities:
        - text
        - reasoning
      recommended_for:
        - code_optimization
        - debugging

