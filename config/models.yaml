# 模型推荐配置
recommendations:
  # 按任务类型推荐
  by_task:
    code_generation:
      best: "claude-opus-4-7"
      alternatives:
        - "gpt-4o"
        - "thirdparty-a-model-1"
        - "gemini-1.5-pro"
        - "deepseek-coder"

    code_review:
      best: "claude-opus-4-7"
      alternatives:
        - "gpt-4o"
        - "thirdparty-b-model-1"
        - "o1"
        - "claude-sonnet-4-6"

    code_refactor:
      best: "claude-opus-4-7"
      alternatives:
        - "gpt-4o"
        - "thirdparty-a-model-1"
        - "o1"

    test_generation:
      best: "claude-sonnet-4-6"
      alternatives:
        - "gpt-4o"
        - "thirdparty-a-model-2"
        - "gemini-1.5-pro"

    code_completion:
      best: "gpt-4o-mini"
      alternatives:
        - "claude-haiku-4-5"
        - "gemini-1.5-flash"
        - "codellama"

    documentation:
      best: "claude-sonnet-4-6"
      alternatives:
        - "gpt-4o"
        - "gemini-1.5-pro"

    debugging:
      best: "o1-mini"
      alternatives:
        - "claude-opus-4-7"
        - "gpt-4o"

    algorithm_design:
      best: "o1"
      alternatives:
        - "claude-opus-4-7"
        - "gpt-4o"

  # 按成本推荐
  by_cost:
    free:
      - "gemini-2.0-flash-exp"
      - "codellama"
      - "deepseek-coder"
      - "qwen2.5-coder"

    low_cost:
      - "gpt-4o-mini"
      - "claude-haiku-4-5"
      - "gemini-1.5-flash"
      - "deepseek-chat"

    balanced:
      - "claude-sonnet-4-6"
      - "gpt-4o"
      - "gemini-1.5-pro"

    premium:
      - "claude-opus-4-7"
      - "o1"
      - "gpt-4-turbo"

  # 按语言推荐
  by_language:
    chinese:
      - "qwen-max"
      - "qwen2.5-coder"
      - "deepseek-coder"
      - "claude-opus-4-7"

    english:
      - "claude-opus-4-7"
      - "gpt-4o"
      - "o1"
      - "gemini-1.5-pro"

  # 按场景推荐
  by_scenario:
    offline:
      - "codellama"
      - "deepseek-coder"
      - "qwen2.5-coder"
      - "llama3.1"

    high_volume:
      - "gpt-4o-mini"
      - "claude-haiku-4-5"
      - "gemini-1.5-flash"

    long_context:
      - "gemini-1.5-pro"
      - "claude-opus-4-7"
      - "llama3.1"

    multimodal:
      - "gpt-4o"
      - "gemini-2.0-flash-exp"
      - "claude-opus-4-7"

# 模型别名
aliases:
  # 简短别名
  gpt4: "gpt-4o"
  gpt4-mini: "gpt-4o-mini"
  claude: "claude-opus-4-7"
  claude-sonnet: "claude-sonnet-4-6"
  gemini: "gemini-1.5-pro"
  gemini-flash: "gemini-1.5-flash"
  deepseek: "deepseek-coder"
  qwen: "qwen-max"
  thirdparty-a: "thirdparty-a-model-1"
  thirdparty-b: "thirdparty-b-model-1"

  # 任务别名
  best-coder: "claude-opus-4-7"
  fast-coder: "gpt-4o-mini"
  free-coder: "codellama"
  chinese-coder: "qwen2.5-coder"
