[workspace]
members = ["crates/rayman"]
# evals/ is a separate dev/research project (agent A/B outcome eval). It is
# intentionally excluded so it never enters the shipped tool's dep tree or CI.
exclude = ["evals"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT"
authors = ["Rayman"]

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.10"
