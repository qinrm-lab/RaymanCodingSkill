[workspace]
members = ["crates/rayman"]
# evals/ is a separate dev/research project (agent A/B outcome eval). It is
# intentionally excluded from the shipped tool's dependency tree and the main
# Cargo workspace; it has its own explicit CI job and dependency policy check.
exclude = ["evals"]
resolver = "2"

[workspace.package]
version = "2.9.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["Rayman"]
homepage = "https://raymanweb.com"
publish = false

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
fs2 = "0.4"
getrandom = "0.4.2"
libc = "0.2.186"
windows-sys = "0.61.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.10"
