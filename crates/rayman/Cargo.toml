[package]
name = "rayman"
version = "2.0.0"
edition = "2024"
license = "MIT"
authors = ["Rayman"]
description = "RaymanCodingSkill: lean coding-agent tooling — workspace context indexing, a minimal goal contract, read-only asset scan, and managed temp."

[[bin]]
name = "rayman"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
ignore = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
