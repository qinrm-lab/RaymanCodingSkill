name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 唯一非自证的强制门禁：机器化执行 fmt / clippy / test，替代此前手打的 validation records。
  check:
    name: fmt + clippy + test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Codex and Claude Code contract isolation
        shell: pwsh
        run: ./scripts/check-agent-instructions.ps1 -SelfTest

      - name: Install ACL test dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends acl

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable, pinned 2026-07-14
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Add Linux ARM64 Rust target
        if: runner.os == 'Linux'
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Check Linux ARM64 cfg paths
        if: runner.os == 'Linux'
        run: cargo check --locked -p rayman --target aarch64-unknown-linux-gnu

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-targets

  msrv:
    name: MSRV (Rust 1.97.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install ACL test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends acl

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable action, explicit MSRV below
        with:
          toolchain: 1.97.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build release artifact with MSRV
        run: cargo build --locked --release

      - name: Test with MSRV
        run: cargo test --locked --workspace --all-targets

  release-contract:
    name: release artifact + CLI contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable, pinned 2026-07-14

      - name: Release verifier command/tag negative self-test
        shell: pwsh
        run: ./scripts/verify-release-contract.ps1 -SelfTest

      - name: Build and verify artifact, PATH, skill binding, and CLI contract
        shell: pwsh
        run: |
          # The pinned rust-toolchain action exports CARGO_INCREMENTAL=0 through
          # GITHUB_ENV. The verifier correctly rejects ambient build shaping, so
          # remove this known action injection before BOTH the reference build and
          # isolated rebuild. Any other value is unexpected and fails closed.
          if (-not [string]::IsNullOrWhiteSpace($env:CARGO_INCREMENTAL) -and
              $env:CARGO_INCREMENTAL -ne '0') {
            throw "Unexpected CARGO_INCREMENTAL before release proof: $env:CARGO_INCREMENTAL"
          }
          Remove-Item Env:CARGO_INCREMENTAL -ErrorAction SilentlyContinue
          if (Test-Path Env:CARGO_INCREMENTAL) {
            throw 'Unable to clear action-injected CARGO_INCREMENTAL.'
          }
          & cargo build --locked --release
          if ($LASTEXITCODE -ne 0) { throw "release build failed: $LASTEXITCODE" }

          $artifactDirectory = Join-Path $PWD "target/release"
          $artifactName = if ($IsWindows) { "rayman.exe" } else { "rayman" }
          $artifact = Join-Path $artifactDirectory $artifactName
          $env:PATH = "$artifactDirectory$([IO.Path]::PathSeparator)$env:PATH"

          # doctor intentionally fails when this workspace-level binding is absent or stale.
          # CI provisions the same binding an installation must have; it does not install anything.
          New-Item -ItemType Directory -Force ".RaymanCodingSkill" | Out-Null
          $skillHash = (Get-FileHash "SKILL.md" -Algorithm SHA256).Hash.ToLowerInvariant()

          # Derive contract/version from the artifact itself, exactly as
          # install-rayman.ps1 does. Hardcoding them here is what let this job
          # drift into writing a binding the CLI rejects.
          $identityText = & $artifact '--format' 'json' 'doctor'
          if ($LASTEXITCODE -ne 0) { throw "artifact could not report its identity: $LASTEXITCODE" }
          $identity = $identityText | ConvertFrom-Json -ErrorAction Stop
          $artifactContract = [string]$identity.contract
          $artifactVersion = [string]$identity.version
          if ([string]::IsNullOrWhiteSpace($artifactContract) -or
              [string]::IsNullOrWhiteSpace($artifactVersion)) {
            throw 'artifact doctor output is missing contract or version.'
          }
          @(
            "skill: raymancodingskill"
            "enabled: true"
            "skill_file: SKILL.md"
            "skill_sha256: $skillHash"
            "cli_contract: $artifactContract"
            "cli_version: $artifactVersion"
          ) | Set-Content -Path ".RaymanCodingSkill/workspace_skill.yaml" -Encoding utf8

          # Exercise the current artifact as its own managed workspace. The tracked
          # quality policy participates in the refreshed index and strict gate.
          & $artifact context refresh
          if ($LASTEXITCODE -ne 0) { throw "context refresh failed: $LASTEXITCODE" }
          & $artifact map quality --profile strict --check
          if ($LASTEXITCODE -ne 0) { throw "strict quality self-dogfood failed: $LASTEXITCODE" }
          & $artifact check --profile release
          if ($LASTEXITCODE -ne 0) { throw "release workspace self-dogfood failed: $LASTEXITCODE" }

          $contractArgs = @{
            CliPath = $artifact
            ReferenceCliPath = $artifact
            SkillPath = (Join-Path $PWD "SKILL.md")
            WorkspaceSkillPath = (Join-Path $PWD "SKILL.md")
            SkillResourceMode = "Source"
            RequirePath = $true
            RequireSourceFresh = $true
          }
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $contractArgs.VerifyGitTag = $true
          }
          & "./scripts/verify-release-contract.ps1" @contractArgs

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Root workspace
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - name: Evals workspace
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: evals/Cargo.toml
          arguments: --config evals/deny.toml

  # evals/ is a standalone project (not in the workspace). Build + mock tests
  # only — the real Anthropic backend needs a key and is not exercised in CI.
  evals:
    name: evals (fmt + clippy + mock tests)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable, pinned 2026-07-14
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: evals
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets

      # The evaluator is intentionally exercised only with its offline mock. This
      # catches CLI wiring, task copying, report creation, and the mutable latest
      # pointer without a model key or any model-network request.
      - name: Build Rayman artifact for offline mock evaluator smoke
        run: cargo build --manifest-path ../Cargo.toml --locked --release -p rayman

      - name: Reject real backend before config, credentials, or network use
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $output = & cargo run --locked -- --backend anthropic --task fix-failing-test --trials 1 2>&1
          $exitCode = $LASTEXITCODE
          $text = ($output | Out-String)
          if ($exitCode -eq 0 -or $text -notmatch '--unsafe-host-exec') {
            throw "A real backend must fail closed without --unsafe-host-exec. Exit=$exitCode`n$text"
          }

      - name: Reject third-party grade command without separate acknowledgement
        shell: pwsh
        run: |
          $tasks = Join-Path $PWD '.runs-custom-grade-ci/tasks'
          $task = Join-Path $tasks 'custom'
          New-Item -ItemType Directory -Force (Join-Path $task 'fixture/src') | Out-Null
          Set-Content -LiteralPath (Join-Path $task 'prompt.md') -Value 'Make no change.' -Encoding utf8
          Set-Content -LiteralPath (Join-Path $task 'grade.txt') -Value 'echo must-not-run' -Encoding utf8
          Set-Content -LiteralPath (Join-Path $task 'fixture/src/lib.rs') -Value 'pub fn sample() {}' -Encoding utf8
          $PSNativeCommandUseErrorActionPreference = $false
          $output = & cargo run --locked -- --backend mock --tasks $tasks --task custom --trials 1 --runs-dir (Join-Path $PWD '.runs-custom-grade-ci/runs') 2>&1
          $exitCode = $LASTEXITCODE
          $text = ($output | Out-String)
          if ($exitCode -eq 0 -or $text -notmatch '--unsafe-custom-grade-exec') {
            throw "A third-party grade must fail closed without --unsafe-custom-grade-exec. Exit=$exitCode`n$text"
          }

      - name: Offline mock evaluator CLI smoke and report provenance
        shell: pwsh
        run: |
          # `/.runs-*` is ignored by evals/.gitignore, so a local replay never
          # leaves trial workspaces/reports as untracked source changes.
          $runs = Join-Path $PWD '.runs-ci'
          & cargo run --locked -- --backend mock --task fix-failing-test --trials 2 --seed 20260711 --runs-dir $runs
          if ($LASTEXITCODE -ne 0) {
            throw "Offline mock evaluator smoke failed with exit code $LASTEXITCODE"
          }
          $latestPath = Join-Path $runs 'latest.json'
          $latest = Get-Content -Raw -LiteralPath $latestPath | ConvertFrom-Json -ErrorAction Stop
          if ([string]::IsNullOrWhiteSpace($latest.run_id) -or
              -not $latest.report_json.StartsWith("$($latest.run_id)/")) {
            throw "latest.json is not a pointer to this immutable run: $latestPath"
          }
          $reportPath = Join-Path $runs $latest.report_json
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            throw "Latest report artifact is missing: $reportPath"
          }
          & git check-ignore -q -- '.runs-ci/latest.json'
          if ($LASTEXITCODE -ne 0) {
            throw "Evaluator run output must remain ignored: $latestPath"
          }
          $report = Get-Content -Raw -LiteralPath $reportPath | ConvertFrom-Json -ErrorAction Stop
          if ($report.provenance.execution_mode -ne 'mock' -or
              [uint64]$report.provenance.seed -ne [uint64]20260711 -or
              $report.provenance.grade_execution.mode -ne 'trusted_builtin_manifest' -or
              $report.provenance.grade_execution.custom_execution_acknowledged -or
              @($report.trials).Count -ne 4) {
            throw "Unexpected offline mock provenance or trial count in $reportPath"
          }

  installer-selftest:
    name: installer CAS self-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install ACL self-test dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends acl
      - name: Installer identity/metadata/race self-test
        shell: pwsh
        run: ./scripts/install-rayman.ps1 -SelfTest

  package-install:
    name: cargo package + install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable, pinned 2026-07-14
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Legacy PowerShell profile migration self-test
        shell: pwsh
        run: ./scripts/repair-rayman-powershell-profile.ps1 -SelfTest
      - run: cargo package --locked -p rayman
      - run: cargo install --locked --path crates/rayman --root .install-smoke
      - run: ./.install-smoke/bin/rayman --version

  coverage:
    name: shipped CLI line coverage threshold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable action, exact toolchain below
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo install cargo-llvm-cov --locked --version 0.8.7
      - run: cargo llvm-cov --locked --workspace --all-features --all-targets --fail-under-lines 75

  scheduled-advisories:
    name: scheduled dependency advisory refresh
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Root advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: advisories
      - name: Evals advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: evals/Cargo.toml
          arguments: --config evals/deny.toml
          command-arguments: advisories
