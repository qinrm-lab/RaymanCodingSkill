name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  # A branch push must not cancel the weekly freshness monitor before its
  # expiry alert can run. Keep cancellation only within the same event/ref.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 唯一非自证的强制门禁：机器化执行 fmt / clippy / test，替代此前手打的 validation records。
  check:
    name: fmt + clippy + test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Codex and Claude Code contract isolation
        shell: pwsh
        run: ./scripts/check-agent-instructions.ps1 -SelfTest

      - name: Install ACL test dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends acl

      - name: Prepare Windows validation host root
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'rayman-validation'
          $null = New-Item -ItemType Directory -Path $root -Force
          $item = Get-Item -LiteralPath $root -Force
          if (-not $item.PSIsContainer -or
              ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
            throw "Windows validation host root must be a real directory: $root"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV `
            -Value "RAYMAN_VALIDATION_TEMP_ROOT=$root" `
            -Encoding utf8

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable, pinned 2026-07-14
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Add Linux ARM64 Rust target
        if: runner.os == 'Linux'
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Check Linux ARM64 cfg paths across all targets
        if: runner.os == 'Linux'
        run: cargo check --locked -p rayman --target aarch64-unknown-linux-gnu --all-targets

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-targets

      - name: Source-bound Rust repository gate
        shell: pwsh
        run: cargo run --locked --manifest-path xtask/Cargo.toml -- repository-gate

  msrv:
    name: MSRV (Rust 1.97.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install ACL test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends acl

      - name: Install MSRV toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable action, explicit MSRV below
        with:
          toolchain: 1.97.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build release artifact with MSRV
        run: cargo build --locked --release

      - name: Test with MSRV
        run: cargo test --locked --workspace --all-targets

  release-contract:
    name: release artifact + CLI contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable, pinned 2026-07-14

      - name: Release verifier command/tag negative self-test
        shell: pwsh
        run: ./scripts/verify-release-contract.ps1 -SelfTest

      - name: Build and verify artifact, PATH, skill binding, and CLI contract
        shell: pwsh
        run: |
          # The pinned rust-toolchain action exports CARGO_INCREMENTAL=0 through
          # GITHUB_ENV. The verifier correctly rejects ambient build shaping, so
          # remove this known action injection before BOTH the reference build and
          # isolated rebuild. Any other value is unexpected and fails closed.
          if (-not [string]::IsNullOrWhiteSpace($env:CARGO_INCREMENTAL) -and
              $env:CARGO_INCREMENTAL -ne '0') {
            throw "Unexpected CARGO_INCREMENTAL before release proof: $env:CARGO_INCREMENTAL"
          }
          Remove-Item Env:CARGO_INCREMENTAL -ErrorAction SilentlyContinue
          if (Test-Path Env:CARGO_INCREMENTAL) {
            throw 'Unable to clear action-injected CARGO_INCREMENTAL.'
          }
          & cargo build --locked --release
          if ($LASTEXITCODE -ne 0) { throw "release build failed: $LASTEXITCODE" }

          $artifactDirectory = Join-Path $PWD "target/release"
          $artifactName = if ($IsWindows) { "rayman.exe" } else { "rayman" }
          $workerName = if ($IsWindows) { "rayman-update-worker.exe" } else { "rayman-update-worker" }
          $artifact = Join-Path $artifactDirectory $artifactName
          $worker = Join-Path $artifactDirectory $workerName
          $env:PATH = "$artifactDirectory$([IO.Path]::PathSeparator)$env:PATH"

          # doctor intentionally fails when this workspace-level binding is absent or stale.
          # CI provisions the same binding an installation must have; it does not install anything.
          New-Item -ItemType Directory -Force ".RaymanCodingSkill" | Out-Null
          $skillHash = (Get-FileHash "SKILL.md" -Algorithm SHA256).Hash.ToLowerInvariant()

          # Derive contract/version from the artifact itself, exactly as
          # install-rayman.ps1 does. Hardcoding them here is what let this job
          # drift into writing a binding the CLI rejects.
          $identityText = & $artifact '--format' 'json' 'doctor'
          if ($LASTEXITCODE -ne 0) { throw "artifact could not report its identity: $LASTEXITCODE" }
          $identity = $identityText | ConvertFrom-Json -ErrorAction Stop
          $artifactContract = [string]$identity.contract
          $artifactVersion = [string]$identity.version
          if ([string]::IsNullOrWhiteSpace($artifactContract) -or
              [string]::IsNullOrWhiteSpace($artifactVersion)) {
            throw 'artifact doctor output is missing contract or version.'
          }
          @(
            "skill: raymancodingskill"
            "enabled: true"
            "skill_file: SKILL.md"
            "skill_sha256: $skillHash"
            "cli_contract: $artifactContract"
            "cli_version: $artifactVersion"
          ) | Set-Content -Path ".RaymanCodingSkill/workspace_skill.yaml" -Encoding utf8

          # Exercise the current artifact as its own managed workspace. The tracked
          # quality policy participates in the refreshed index and strict gate.
          & $artifact context refresh
          if ($LASTEXITCODE -ne 0) { throw "context refresh failed: $LASTEXITCODE" }
          & $artifact map quality --profile strict --check
          if ($LASTEXITCODE -ne 0) { throw "strict quality self-dogfood failed: $LASTEXITCODE" }
          & $artifact check --profile release
          if ($LASTEXITCODE -ne 0) { throw "release workspace self-dogfood failed: $LASTEXITCODE" }

          $contractArgs = @{
            CliPath = $artifact
            ReferenceCliPath = $artifact
            WorkerPath = $worker
            ReferenceWorkerPath = $worker
            SkillPath = (Join-Path $PWD "SKILL.md")
            WorkspaceSkillPath = (Join-Path $PWD "SKILL.md")
            SkillResourceMode = "Source"
            RequirePath = $true
            RequireSourceFresh = $true
          }
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $contractArgs.VerifyGitTag = $true
          }
          & "./scripts/verify-release-contract.ps1" @contractArgs

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Root workspace
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - name: Evals workspace
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: evals/Cargo.toml
          arguments: --config evals/deny.toml

  # evals/ is a standalone project (not in the workspace). Build + mock tests
  # only — the real Anthropic backend needs a key and is not exercised in CI.
  evals:
    name: evals (fmt + clippy + mock tests)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable, pinned 2026-07-14
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: evals
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-targets

      # The evaluator is intentionally exercised only with its offline mock. This
      # catches CLI wiring, task copying, report creation, and the mutable latest
      # pointer without a model key or any model-network request.
      - name: Build Rayman artifact for offline mock evaluator smoke
        run: cargo build --manifest-path ../Cargo.toml --locked --release -p rayman

      - name: Reject real backend before config, credentials, or network use
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $output = & cargo run --locked -- --backend anthropic --task fix-failing-test --trials 1 2>&1
          $exitCode = $LASTEXITCODE
          $text = ($output | Out-String)
          if ($exitCode -eq 0 -or $text -notmatch '--unsafe-host-exec') {
            throw "A real backend must fail closed without --unsafe-host-exec. Exit=$exitCode`n$text"
          }
          exit 0

      - name: Reject third-party grade command without separate acknowledgement
        shell: pwsh
        run: |
          $tasks = Join-Path $PWD '.runs-custom-grade-ci/tasks'
          $task = Join-Path $tasks 'custom'
          New-Item -ItemType Directory -Force (Join-Path $task 'fixture/src') | Out-Null
          Set-Content -LiteralPath (Join-Path $task 'prompt.md') -Value 'Make no change.' -Encoding utf8
          Set-Content -LiteralPath (Join-Path $task 'grade.txt') -Value 'echo must-not-run' -Encoding utf8
          Set-Content -LiteralPath (Join-Path $task 'fixture/src/lib.rs') -Value 'pub fn sample() {}' -Encoding utf8
          $PSNativeCommandUseErrorActionPreference = $false
          $output = & cargo run --locked -- --backend mock --tasks $tasks --task custom --trials 1 --runs-dir (Join-Path $PWD '.runs-custom-grade-ci/runs') 2>&1
          $exitCode = $LASTEXITCODE
          $text = ($output | Out-String)
          if ($exitCode -eq 0 -or $text -notmatch '--unsafe-custom-grade-exec') {
            throw "A third-party grade must fail closed without --unsafe-custom-grade-exec. Exit=$exitCode`n$text"
          }
          exit 0

      - name: Offline mock evaluator CLI smoke and report provenance
        shell: pwsh
        run: |
          # `/.runs-*` is ignored by evals/.gitignore, so a local replay never
          # leaves trial workspaces/reports as untracked source changes.
          $runs = Join-Path $PWD '.runs-ci'
          & cargo run --locked -- --backend mock --task fix-failing-test --trials 2 --seed 20260711 --runs-dir $runs
          if ($LASTEXITCODE -ne 0) {
            throw "Offline mock evaluator smoke failed with exit code $LASTEXITCODE"
          }
          $latestPath = Join-Path $runs 'latest.json'
          $latest = Get-Content -Raw -LiteralPath $latestPath | ConvertFrom-Json -ErrorAction Stop
          if ([string]::IsNullOrWhiteSpace($latest.run_id) -or
              -not $latest.report_json.StartsWith("$($latest.run_id)/")) {
            throw "latest.json is not a pointer to this immutable run: $latestPath"
          }
          $reportPath = Join-Path $runs $latest.report_json
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) {
            throw "Latest report artifact is missing: $reportPath"
          }
          & git check-ignore -q -- '.runs-ci/latest.json'
          if ($LASTEXITCODE -ne 0) {
            throw "Evaluator run output must remain ignored: $latestPath"
          }
          $report = Get-Content -Raw -LiteralPath $reportPath | ConvertFrom-Json -ErrorAction Stop
          if ($report.provenance.execution_mode -ne 'mock' -or
              [uint64]$report.provenance.seed -ne [uint64]20260711 -or
              $report.provenance.grade_execution.mode -ne 'trusted_builtin_manifest' -or
              $report.provenance.grade_execution.custom_execution_acknowledged -or
              @($report.trials).Count -ne 4) {
            throw "Unexpected offline mock provenance or trial count in $reportPath"
          }
          $causalClaimEligible = $report.interpretation.causal_claim_eligible
          if ($causalClaimEligible -isnot [bool] -or
              $causalClaimEligible -ne $false) {
            throw "Offline mock report must contain boolean causal_claim_eligible=false: $reportPath"
          }

  installer-selftest:
    name: installer CAS self-test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install ACL self-test dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends acl
      - name: Installer identity/metadata/race self-test
        shell: pwsh
        run: |
          ./scripts/install-rayman.ps1 -SelfTest
          ./scripts/update-rayman.ps1 -SelfTest

  package-install:
    name: cargo package + install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable, pinned 2026-07-14
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Legacy PowerShell profile migration self-test
        shell: pwsh
        run: ./scripts/repair-rayman-powershell-profile.ps1 -SelfTest
      - run: cargo package --locked -p rayman
      - run: cargo install --locked --path crates/rayman --root .install-smoke
      - run: ./.install-smoke/bin/rayman --version

  coverage:
    name: shipped CLI line coverage threshold (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/rayman-coverage-target
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install ACL test dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends acl

      - name: Prepare Windows validation host root
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'rayman-validation'
          $null = New-Item -ItemType Directory -Path $root -Force
          $item = Get-Item -LiteralPath $root -Force
          if (-not $item.PSIsContainer -or
              ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
            throw "Windows validation host root must be a real directory: $root"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV `
            -Value "RAYMAN_VALIDATION_TEMP_ROOT=$root" `
            -Encoding utf8

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable action, exact toolchain below
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo install cargo-llvm-cov --locked --version 0.8.7
      - run: cargo llvm-cov --locked --workspace --all-features --all-targets --fail-under-lines 75

  signed-release:
    name: signed Windows update release
    if: github.ref_type == 'tag'
    needs:
      - check
      - msrv
      - release-contract
      - deny
      - evals
      - installer-selftest
      - package-install
      - coverage
    runs-on: windows-latest
    environment: rayman-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable, pinned 2026-07-14

      - name: Build fixed Windows release assets
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:CARGO_INCREMENTAL) -and
              $env:CARGO_INCREMENTAL -ne '0') {
            throw "Unexpected CARGO_INCREMENTAL before signed release build: $env:CARGO_INCREMENTAL"
          }
          Remove-Item Env:CARGO_INCREMENTAL -ErrorAction SilentlyContinue
          cargo build --locked --release -p rayman
          if ($LASTEXITCODE -ne 0) { throw "release build failed: $LASTEXITCODE" }

      - name: Verify exact release binaries source-fresh before staging
        shell: pwsh
        run: |
          Remove-Item Env:CARGO_INCREMENTAL -ErrorAction SilentlyContinue
          $finalCli = (Resolve-Path -LiteralPath 'target/release/rayman.exe').ProviderPath
          $finalWorker = (Resolve-Path -LiteralPath 'target/release/rayman-update-worker.exe').ProviderPath
          ./scripts/verify-release-contract.ps1 `
            -CliPath $finalCli `
            -ReferenceCliPath $finalCli `
            -WorkerPath $finalWorker `
            -ReferenceWorkerPath $finalWorker `
            -SkillPath (Join-Path $PWD 'SKILL.md') `
            -WorkspaceSkillPath (Join-Path $PWD 'SKILL.md') `
            -SkillResourceMode Source `
            -RequireSourceFresh `
            -VerifyGitTag

      - name: Stage only the verified release bytes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/rayman.exe dist/rayman-windows-x86_64.exe
          Copy-Item target/release/rayman-update-worker.exe dist/rayman-update-worker-windows-x86_64.exe
          if ((Get-FileHash target/release/rayman.exe -Algorithm SHA256).Hash -cne
              (Get-FileHash dist/rayman-windows-x86_64.exe -Algorithm SHA256).Hash) {
            throw 'Staged CLI differs from the source-fresh verified binary.'
          }
          if ((Get-FileHash target/release/rayman-update-worker.exe -Algorithm SHA256).Hash -cne
              (Get-FileHash dist/rayman-update-worker-windows-x86_64.exe -Algorithm SHA256).Hash) {
            throw 'Staged worker differs from the source-fresh verified binary.'
          }
          Copy-Item SKILL.md dist/raymancodingskill-SKILL.md
          Copy-Item AGENT_CONTRACT.md dist/raymancodingskill-AGENTS.md
          Copy-Item references/workflow-contract.md dist/raymancodingskill-workflow-contract.md
          Copy-Item scripts/install-rayman.ps1 dist/install-rayman.ps1

      - name: Create and sign canonical update manifest
        shell: pwsh
        env:
          RAYMAN_UPDATE_SIGNING_KEY_PEM_B64: ${{ secrets.RAYMAN_UPDATE_SIGNING_KEY_PEM_B64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RAYMAN_UPDATE_SIGNING_KEY_PEM_B64)) {
            throw 'Protected release environment is missing RAYMAN_UPDATE_SIGNING_KEY_PEM_B64.'
          }
          $commit = (git rev-parse HEAD).Trim()
          $sequenceText = (git rev-list --count HEAD).Trim()
          [uint64]$sequence = 0
          if (-not [uint64]::TryParse($sequenceText, [ref]$sequence) -or $sequence -eq 0) {
            throw "Unable to derive a positive release sequence: $sequenceText"
          }
          $issued = [DateTimeOffset]::UtcNow
          $expires = $issued.AddDays(30)
          $keyPath = Join-Path $env:RUNNER_TEMP 'rayman-update-signing-key.pem'
          try {
            [IO.File]::WriteAllBytes(
              $keyPath,
              [Convert]::FromBase64String($env:RAYMAN_UPDATE_SIGNING_KEY_PEM_B64)
            )
            ./scripts/update-rayman.ps1 `
              -AssetRoot dist `
              -InstallManifest install-manifest.json `
              -Commit $commit `
              -Sequence $sequence `
              -IssuedAt $issued.ToString('yyyy-MM-ddTHH:mm:ssZ') `
              -ExpiresAt $expires.ToString('yyyy-MM-ddTHH:mm:ssZ') `
              -OutputDirectory dist `
              -WorkerPath target/release/rayman-update-worker.exe `
              -SigningKeyPath $keyPath
          } finally {
            if (Test-Path -LiteralPath $keyPath -PathType Leaf) {
              Remove-Item -LiteralPath $keyPath -Force
            }
          }
          Remove-Item -LiteralPath dist/rayman-update-manifest-v1.payload -Force

      - name: Verify signed metadata has a full release window
        shell: pwsh
        run: |
          ./scripts/check-update-freshness.ps1 `
            -ManifestPath dist/rayman-update-manifest-v1.json `
            -SignaturePath dist/rayman-update-manifest-v1.sig `
            -WorkerPath target/release/rayman-update-worker.exe `
            -MinimumRemainingDays 29

      - name: Publish immutable asset set for the exact tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            'dist/rayman-windows-x86_64.exe',
            'dist/rayman-update-worker-windows-x86_64.exe',
            'dist/raymancodingskill-SKILL.md',
            'dist/raymancodingskill-AGENTS.md',
            'dist/raymancodingskill-workflow-contract.md',
            'dist/install-rayman.ps1',
            'dist/rayman-update-manifest-v1.json',
            'dist/rayman-update-manifest-v1.sig'
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Release asset is missing: $asset"
            }
          }
          gh release create $env:GITHUB_REF_NAME @assets `
            --verify-tag `
            --title "RaymanCodingSkill $env:GITHUB_REF_NAME" `
            --notes "Signed Windows x86_64 update bundle for $env:GITHUB_SHA"

  signed-release-freshness:
    name: signed release expiry guard
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable, pinned 2026-07-14

      - name: Verify latest signed release remains installable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseText = gh release view --json tagName,isDraft,isPrerelease
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to resolve the latest GitHub Release: $LASTEXITCODE"
          }
          $release = $releaseText | ConvertFrom-Json -ErrorAction Stop
          $tag = [string]$release.tagName
          if ($release.isDraft -or $release.isPrerelease -or
              $tag -notmatch '^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$') {
            throw "Latest release is not a canonical stable tag: $tag"
          }
          git show-ref --verify --quiet "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Latest release tag is absent from the checked-out repository: $tag"
          }
          $tagCommit = (git rev-list -n 1 $tag).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -notmatch '^[0-9a-f]{40}$') {
            throw "Unable to resolve the exact release commit for $tag"
          }

          $nonce = [Guid]::NewGuid().ToString('N')
          $assetRoot = Join-Path $env:RUNNER_TEMP "rayman-release-assets-$nonce"
          try {
            # The verifier comes from current protected main, never from the
            # release being inspected. A malicious tag cannot substitute its
            # own trust root and certify itself.
            cargo build --locked --release --bin rayman-update-worker
            if ($LASTEXITCODE -ne 0) { throw 'Unable to build the current update verifier.' }

            $null = New-Item -ItemType Directory -Path $assetRoot
            gh release download $tag `
              --pattern rayman-update-manifest-v1.json `
              --pattern rayman-update-manifest-v1.sig `
              --dir $assetRoot
            if ($LASTEXITCODE -ne 0) { throw "Unable to download signed metadata for $tag." }

            $worker = Join-Path $PWD 'target/release/rayman-update-worker'
            $freshnessText = ./scripts/check-update-freshness.ps1 `
              -ManifestPath (Join-Path $assetRoot 'rayman-update-manifest-v1.json') `
              -SignaturePath (Join-Path $assetRoot 'rayman-update-manifest-v1.sig') `
              -WorkerPath $worker `
              -ExpectedVersion $tag.Substring(1) `
              -MinimumRemainingDays 14
            $freshness = $freshnessText | ConvertFrom-Json -ErrorAction Stop
            if ($freshness.release_tag -cne $tag -or
                $freshness.commit_sha -cne $tagCommit) {
              throw "Signed metadata is not bound to $tag at $tagCommit."
            }
          } finally {
            if (Test-Path -LiteralPath $assetRoot -PathType Container) {
              Remove-Item -LiteralPath $assetRoot -Recurse -Force
            }
          }

  scheduled-advisories:
    name: scheduled dependency advisory refresh
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Root advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: advisories
      - name: Evals advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: evals/Cargo.toml
          arguments: --config evals/deny.toml
          command-arguments: advisories
