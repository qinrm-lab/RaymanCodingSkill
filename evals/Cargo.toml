[package]
name = "rayman-evals"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Standalone project: NOT part of the main workspace, so its LLM/http deps never
# touch the lean `rayman` tool or its CI.

[[bin]]
name = "rayman-evals"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
# Keep the evaluator's runtime secure-temp primitive on a pre-0.4-getrandom
# release. The standalone evaluator intentionally denies duplicate
# dependency versions, and reqwest/ring still require getrandom 0.2.
tempfile = "=3.10.1"
